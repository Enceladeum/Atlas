<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%23e8b04b'/><path d='M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4' stroke='%230b0d10' stroke-width='1.2' fill='none'/></svg>">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div id="app">
  <nav id="rail">
    <div class="rail-brand" title="Atlas">
      <svg viewBox="0 0 24 24" width="26" height="26"><circle cx="12" cy="12" r="10" fill="var(--accent)"/><path d="M12 3v18M3 12h18M5.6 5.6l12.8 12.8M18.4 5.6L5.6 18.4" stroke="var(--bg0)" stroke-width="1.2" fill="none"/></svg>
      <span>Atlas</span>
      <span id="ver" class="rail-ver"></span>
    </div>
    <a class="rail-item" href="#/sheets" data-route="sheets">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 10h16M4 15h16M4 20h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
      <span>Sheets</span>
    </a>
    <a class="rail-item" href="#/territory" data-route="territory">
      <svg viewBox="0 0 24 24"><path d="M9 4L4 6v14l5-2 6 2 5-2V4l-5 2-6-2zM9 4v14M15 6v14" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/></svg>
      <span>Territories</span>
    </a>
    <a class="rail-item" href="#/assets" data-route="assets">
      <svg viewBox="0 0 24 24"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9L12 2zM12 11l8-4.5M12 11L4 6.5M12 11v9" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/></svg>
      <span>Assets</span>
    </a>
    <div class="rail-spacer"></div>
    <div class="rail-status" id="conn" title="server status"><span class="dot"></span><span id="conn-label">…</span></div>
  </nav>
  <div id="main">
    <header id="topbar">
      <div id="crumbs">Atlas</div>
      <button id="palette-btn" title="Jump to anything">
        <svg viewBox="0 0 24 24" width="14" height="14"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Search</span><kbd>Ctrl K</kbd>
      </button>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="palette" class="hidden">
  <div class="palette-panel">
    <input id="palette-input" type="text" placeholder="Jump to a sheet, territory id, or game path…" autocomplete="off" spellcheck="false">
    <div id="palette-results"></div>
  </div>
</div>
<div id="toasts"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
